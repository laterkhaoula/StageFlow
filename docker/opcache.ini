; ============================================================================
; StageFlow — Correction de performance pour le développement sous Docker Desktop
; sur Windows.
;
; PROBLÈME RACINE (mesuré sur ce projet)
;   1. Le code Laravel est monté depuis l'hôte Windows (bind mount .:/var/www).
;      Sur Docker Desktop Windows, chaque stat/open de fichier est extrêmement
;      lent : ~44 ms par filemtime() (vs ~4 µs dans le conteneur), soit environ
;      10 000 fois plus lent ; la lecture de 74 fichiers prend 4 s en monté
;      (vs 1,3 ms en local).
;   2. L'application tourne via `php artisan serve` (SAPI CLI) : OPcache était
;      désactivé pour le CLI par défaut (opcache.enable_cli=0), donc chaque
;      requête relisait ET recompilait tout le framework depuis le montage lent.
;   3. Conséquence mesurée : boot à froid ~26-44 s, requêtes HTTP 7-15 s,
;      boot de n'importe quelle commande `artisan` ~44 s.
; 
; SOLUTION
;   OPcache est activé (y compris pour la SAPI CLI) et les timestamps ne sont
;   plus revalidés : chaque fichier PHP n'est lu et compilé QU'UNE FOIS par
;   démarrage du conteneur, puis servi depuis la mémoire partagée.
;   - Requêtes HTTP après le 1er accès : ~0,5-2 s (au lieu de 7-15 s).
;   - Le 1er accès après un restart paie une compilation unique (~13-26 s).
;
; LIMITE CONNUE (Docker Desktop)
;   Les commandes CLI éphémères (`docker compose exec app php artisan ...`,
;   tests, migrate) sont des processus indépendants : ils ne peuvent pas
;   partager le segment de mémoire anonyme d'OPcache (contrairement aux workers
;   PHP-FPM, qui sont fork()és). Chacun recompile donc l'application (~44 s).
;   → Alternative testée et ÉCARTÉE : opcache.file_cache_only=1 rend le CLI
;     rapide (~11 s) mais dégrade chaque requête HTTP à 3-7 s (lecture disque
;     des opcodes), inacceptable pour la navigation.
;
; ⚠️ Conséquence pour le développeur :
;   Toute modification d'un fichier PHP ou Blade n'est prise en compte qu'après
;   redémarrage du conteneur :
;       docker compose restart app
;   (validate_timestamps=0 est volontaire : la revalidation forcerait un stat
;   par fichier à chaque requête, ce qui ravive le goulot d'étranglement.)
; ============================================================================

; Activer OPcache (déjà On en SAPI serveur, indispensable ici en CLI).
opcache.enable=1

; L'app tourne via `php artisan serve` (SAPI CLI) : activer aussi pour CLI.
opcache.enable_cli=1

; Ne pas revalider les timestamps : fichiers lus/compilés une seule fois.
; => Requiert `docker compose restart app` après toute modif PHP/Blade.
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Le framework compte plus de 10 000 fichiers : couvrir la totalité.
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16